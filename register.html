<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Create a new SafeLink account to start checking URLs and QR codes safely.">
    <title>Register - SafeLink</title>

    <style>
        :root {
            --primary-color: #1d4ed8;
            --text-color: #1e293b;
            --background-color: #f8fafc;
            --card-background: #ffffff;
            --border-color: #cbd5e1;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            line-height: 1.6;
            color: var(--text-color);
            background-color: var(--background-color);
            margin: 0;
            padding: 0;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        h1 a {
            color: var(--primary-color);
            text-decoration: none;
            font-size: 2.2rem;
        }

        .card {
            background-color: var(--card-background);
            border: 2px solid var(--border-color);
            border-radius: 8px;
            padding: 2rem;
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            font-weight: bold;
            font-size: 1rem;
            margin-bottom: 0.5rem;
        }

        input[type="text"],
        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            box-sizing: border-box;
            margin-bottom: 1.25rem;
        }

        input:focus,
        button:focus,
        .btn-google:focus {
            outline: 3px solid #f59e0b;
            outline-offset: 2px;
        }

        .btn-submit {
            width: 100%;
            background-color: var(--primary-color);
            color: white;
            font-size: 1.1rem;
            font-weight: bold;
            padding: 0.8rem;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .btn-submit:hover {
            background-color: #1e40af;
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 1.5rem 0;
            color: #64748b;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border-color);
        }

        .divider span {
            padding: 0 0.75rem;
            font-size: 0.9rem;
            font-weight: bold;
        }

        .btn-google {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            width: 100%;
            background-color: #ffffff;
            color: #374151;
            font-size: 1rem;
            font-weight: bold;
            padding: 0.8rem;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            box-sizing: border-box;
        }

        .btn-google:hover {
            background-color: #f1f5f9;
        }

        .auth-footer {
            text-align: center;
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- Header -->
        <header role="banner">
            <h1><a href="index.html">SafeLink</a></h1>
            <p><strong>Create your account</strong></p>
        </header>

        <!-- Main Form -->
        <main role="main">
            <section class="card" aria-labelledby="register-heading">
                <h2 id="register-heading" style="margin-top: 0; font-size: 1.5rem;">Create Account</h2>

                <!-- Google Sign-Up Button -->
                <button type="button" class="btn-google" aria-label="Sign up with Google">
                    <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    Sign up with Google
                </button>

                <div class="divider">
                    <span>OR</span>
                </div>

                <!-- Registration Form -->
                <form action="#" method="post">
                    <div>
                        <label for="full-name">Full Name</label>
                        <input type="text" id="full-name" name="full-name" placeholder="John Doe" required aria-required="true">
                    </div>

                    <div>
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@example.com" required aria-required="true">
                    </div>

                    <div>
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="At least 8 characters" required aria-required="true">
                    </div>

                    <div>
                        <label for="confirm-password">Confirm Password</label>
                        <input type="password" id="confirm-password" name="confirm-password" placeholder="Re-enter your password" required aria-required="true">
                    </div>

                    <button type="submit" class="btn-submit">Create Account</button>
                </form>
            </section>

            <div class="auth-footer">
                <p>Already have an account? <a href="signin.html">Sign in here</a></p>
                <p><a href="index.html">&larr; Back to Home</a></p>
            </div>
        </main>

        <footer role="contentinfo" style="margin-top: 3rem; font-size: 0.9rem; text-align: center; color: #64748b;">
            <p>&copy; SafeLink Project</p>
        </footer>

    </div>

</body>
</html>
