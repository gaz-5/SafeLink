<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="SafeLink - A simple URL and link safety checker.">
    <title>SafeLink - Link Safety Checker</title>

    <!-- fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Mono&family=Google+Sans+Flex:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <div>
                <h1>SafeLink</h1>
                <p class="tagline"><strong>URL and QR Code Safety Checker</strong></p>
            </div>
            <button type="button" id="theme-toggle">Light mode</button>
        </header>

        <main>

            <!-- Section 1: URL & Text Input Form -->
            <section class="card" aria-labelledby="form-heading">
                <h2 id="form-heading">Check a Link or Message</h2>

                <form action="#" method="get">
                    <label for="url-input">Paste URL address or text message below:</label>
                    <input type="text"
                           id="url-input"
                           name="url"
                           placeholder="e.g. https://example.com or paste full SMS message"
                           required>

                    <button type="submit">Analyze Safety Rating</button>
                </form>
            </section>

            <!-- Section 2: QR Code Scan Section -->
            <section class="card" aria-labelledby="qr-heading">
                <h2 id="qr-heading">Or Upload a QR Code</h2>

                <form action="#" method="post" enctype="multipart/form-data">
                    <label for="qr-file">Select QR code image file from your device:</label>
                    <input type="file" id="qr-file" name="qr-image" accept="image/*">

                    <button type="submit">Scan QR Code</button>
                </form>
            </section>

        </main>

        <!-- Footer -->
        <footer>
            <p>SafeLink Project |<a href="https://github.com/gaz-5/SafeLink"> GitHub </a></p>
        </footer>

    </div>

    <script src="script.js"></script>
</body>
</html>
